<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ops dashboard — Universality</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Universal<span>ity</span> — Ops</div>
    <div class="user-chip" id="userChip"><a href="/clipper.html">My dashboard</a></div>
  </div>

  <div class="wrap wide">
    <div id="banner"></div>

    <div class="panel">
      <div class="hero-number" id="totalViews">—</div>
      <div class="hero-label">total views tracked across all clippers</div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="totalLikes">—</div><div class="label">likes</div></div>
        <div class="stat"><div class="num" id="totalComments">—</div><div class="label">comments</div></div>
        <div class="stat"><div class="num" id="totalSaves">—</div><div class="label">saves</div></div>
        <div class="stat"><div class="num" id="totalSubs">—</div><div class="label">clips submitted</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by Discord username or Instagram handle...">
        <button class="btn secondary" id="clearSearch">Clear</button>
      </div>

      <table>
        <thead>
          <tr><th>Clipper</th><th>TikTok</th><th>Instagram</th><th class="num-col">Views</th><th class="num-col">Clips</th></tr>
        </thead>
        <tbody id="leaderboardBody"><tr><td colspan="5" style="text-align:center;color:var(--text-dim);">Loading…</td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No clippers match that search.</div>
    </div>
  </div>

  <script src="/js/ops.js"></script>
</body>
</html>
